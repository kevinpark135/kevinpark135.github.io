<article class="project-card" data-tone="{{ project.tone }}">
  <div class="project-card__visual" aria-hidden="true">
    <span class="project-card__orb project-card__orb--one"></span>
    <span class="project-card__orb project-card__orb--two"></span>
    <span class="project-card__code">{{ project.slug | slice: 0, 2 | upcase }}</span>
  </div>
  <div class="project-card__body">
    <p class="eyebrow">{{ project.kicker }}{% if project.year %} · {{ project.year }}{% endif %}</p>
    <h3>{{ project.title }}</h3>
    <p>{{ project.summary }}</p>
    <ul class="tag-list" aria-label="Technologies and topics">
      {% for tag in project.tags %}
        <li>{{ tag }}</li>
      {% endfor %}
    </ul>
    {% if project.link %}
      <a class="text-link" href="{{ project.link }}">View project <span aria-hidden="true">↗</span></a>
    {% endif %}
  </div>
</article>
